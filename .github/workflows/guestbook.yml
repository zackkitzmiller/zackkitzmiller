name: Guestbook

on:
  issues:
    types: [opened]

jobs:
  sign-guestbook:
    if: contains(github.event.issue.labels.*.name, 'guestbook')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign the guestbook
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const readme = fs.readFileSync('README.md', 'utf8');
            const issue = context.payload.issue;

            const END = '<!-- GUESTBOOK:END -->';

            if (!readme.includes('<!-- GUESTBOOK:START -->') || !readme.includes(END)) {
              core.setFailed('Guestbook boundaries not found in README.md');
              return;
            }

            // Sanitize inputs — strip HTML comments so nobody can break boundaries
            const sanitize = (str) => str.replace(/<!--/g, '').replace(/-->/g, '').trim();
            const title = sanitize(issue.title);
            const body = sanitize(issue.body || '');
            const user = issue.user.login;
            const date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            // Compact one-liner entry
            const message = body ? ` ${body}` : '';
            const entry = `> **${title}** —${message} _— @${user}, ${date}_`;

            // Count existing entries (each starts with "> **")
            const existingCount = (readme.match(/^> \*\*/gm) || []).length;
            const newCount = existingCount + 1;
            const plural = newCount === 1 ? 'Entry' : 'Entries';

            // Insert new entry before END boundary
            let updated = readme.replace(
              END,
              `${entry}\n\n${END}`
            );

            // Update count — match the header loosely so dashes/encoding don't matter
            updated = updated.replace(
              /^(###\s*📖\s*GuestBook\s*).+$/m,
              `$1— ${newCount} ${plural}`
            );

            fs.writeFileSync('README.md', updated);
            core.info(`Guestbook entry #${newCount} added for @${user}`);

            core.exportVariable('ENTRY_NUMBER', newCount);
            core.exportVariable('GUEST_USER', user);

      - name: Commit and push
        run: |
          git config user.name "guestbook[bot]"
          git config user.email "guestbook[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "📖 guestbook entry #${ENTRY_NUMBER} by @${GUEST_USER}"
          git push

      - name: Close the issue with a thank you
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Thanks for signing the guestbook, @${issue.user.login}! 📖✨`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
